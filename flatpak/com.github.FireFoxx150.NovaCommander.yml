app-id: com.github.FireFoxx150.NovaCommander
runtime: org.freedesktop.Platform
runtime-version: '26.08'
sdk: org.freedesktop.Sdk
command: nova-commander
finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --filesystem=host
  - --talk-name=org.freedesktop.Notifications
modules:
  - name: nova-commander
    buildsystem: simple
    sources:
      - type: dir
        path: ..
        skip:
          - .git
          - dist
          - .flatpak-builder
          - flatpak/.build
    build-commands:
      - mkdir -p /app/lib/nova-commander/resources/app
      - cp -a node_modules/electron/dist/. /app/lib/nova-commander/
      - mv /app/lib/nova-commander/electron /app/lib/nova-commander/nova-commander
      - rm -f /app/lib/nova-commander/resources/default_app.asar
      - cp -a main.js preload.js package.json icon.png renderer LICENSE THIRD_PARTY_NOTICES.md /app/lib/nova-commander/resources/app/
      - install -Dm755 flatpak/nova-commander.sh /app/bin/nova-commander
      - install -Dm644 flatpak/com.github.FireFoxx150.NovaCommander.desktop /app/share/applications/com.github.FireFoxx150.NovaCommander.desktop
      - install -Dm644 flatpak/com.github.FireFoxx150.NovaCommander.metainfo.xml /app/share/metainfo/com.github.FireFoxx150.NovaCommander.metainfo.xml
      - install -Dm644 icon.svg /app/share/icons/hicolor/scalable/apps/com.github.FireFoxx150.NovaCommander.svg
      - for s in 16 32 48 64 128 256 512; do install -Dm644 build/icons/$s.png /app/share/icons/hicolor/${s}x${s}/apps/com.github.FireFoxx150.NovaCommander.png; done
